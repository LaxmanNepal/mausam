<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नेपाल जिल्ला मौसम — मौसम</title><meta name="description" content="नेपालका ७७ जिल्लाको मौसम, वर्षा, हावा, UV र मौसम संकेत।"><link rel="stylesheet" href="../style.css"></head><body><main><section class="card" style="margin:18px"><h1>🇳🇵 ७७ जिल्ला मौसम</h1><p class="muted">जिल्ला छान्नुहोस् र मौसम हेर्नुहोस्।</p><div id="districtList" class="district-grid"></div></section></main><script src="../districts.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=window.NEPAL_DISTRICTS||window.districts||[];const list=document.getElementById('districtList');const a=Array.isArray(d)?d:Object.entries(d).map(([name,x])=>({name,...x}));list.innerHTML=a.map(x=>'<a class="district-card" href="../?place='+encodeURIComponent(x.name||x[0]||'')+'">'+(x.name||x[0]||'जिल्ला')+'</a>').join('')||'<p>जिल्ला डाटा लोड भएन।</p>'})</script></body></html>
